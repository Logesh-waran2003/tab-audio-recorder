<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; width: 260px; padding: 12px; margin: 0; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  button { width: 100%; padding: 9px; font-size: 13px; border-radius: 6px; border: 0; cursor: pointer; }
  #go.rec { background: #c62828; color: #fff; }
  #go.idle { background: #1565c0; color: #fff; }
  #microw { display: flex; align-items: flex-start; gap: 7px; margin: 10px 0 2px; }
  #microw label { font-size: 12.5px; cursor: pointer; line-height: 1.35; }
  #microw label span { display: block; color: #777; font-size: 11px; }
  #info { margin-top: 8px; color: #555; font-size: 12px; min-height: 30px; }
  #info.err { color: #c62828; }
  #grant { margin-top: 6px; font-size: 11.5px; color: #1565c0; text-decoration: underline;
           cursor: pointer; display: none; }
  #reset { margin-top: 8px; font-size: 11px; color: #888; text-decoration: underline;
           cursor: pointer; display: none; }
</style>
</head>
<body>
  <h1>Tab Audio Recorder</h1>
  <button id="go" class="idle">Start recording</button>

  <div id="microw">
    <input type="checkbox" id="mic" checked>
    <label for="mic">Record my microphone too
      <span>Them on the left channel, you on the right.</span>
    </label>
  </div>

  <div id="microw">
    <input type="checkbox" id="discreet">
    <label for="discreet">Quiet toolbar
      <span>No REC badge. Use when you screen share.</span>
    </label>
  </div>

  <div id="info">Ready.</div>
  <div id="grant">Microphone blocked — click to allow it once</div>
  <div id="reset">Stuck? Force reset (loses the current recording)</div>
  <script src="popup.js"></script>
</body>
</html>
